name: Auto Update M3U Playlist

on:
  schedule:
    # Menjalankan script setiap 3 jam sekali (sebelum token 4 jam kedaluwarsa)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Mengizinkan eksekusi manual via tombol "Run workflow"

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Mengizinkan bot untuk menyimpan file M3U ke repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Python Script
        run: python generate_m3u.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Menyimpan semua file berekstensi .m3u (gabungan, indo, dan luar)
          git add *.m3u
          
          # Menyimpan dengan pesan commit berisi jam saat ini
          git commit -m "Auto-update playlist $(date +'%Y-%m-%d %H:%M:%S')" || echo "No changes to commit"
          git push
